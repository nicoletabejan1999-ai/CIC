name: CIC RU banner captions transfer
on:
  push:
    branches:
      - chatgpt/v3-drive-transfer-20261005
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fL 'https://files2.heygen.ai/video_translate/6561cb3122a0413dadffe5289ba0760d-ru/caption.srt' -o caption.srt
      - uses: actions/upload-artifact@v4
        with:
          name: cic-banner-ru-caption
          path: caption.srt
          retention-days: 1
