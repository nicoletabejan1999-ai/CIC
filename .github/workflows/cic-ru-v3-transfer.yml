name: CIC RU v3 Drive transfer
on:
  push:
    branches:
      - chatgpt/v3-drive-transfer-20261005

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download approved v3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3513hjTX9dfVdwpdWvNObwmplGU/6344fea5-ae34-423a-b2a7-49083f9c34aa.mp4' -o CIC-Reabilitare-RU-Proba-01.mp4
          echo 'ed8faf315c55d41fc13c3d72d3f3e3f7628587821e41690dcdef2f4c5090c17b  CIC-Reabilitare-RU-Proba-01.mp4' | sha256sum -c -
      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cic-ru-v3-transfer
          path: CIC-Reabilitare-RU-Proba-01.mp4
          compression-level: 0
          retention-days: 1
